name: Build and publish release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build-android:
        name: Build Android APK
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true

            - name: Install dependencies
              run: flutter pub get

            - name: Generate source files
              run: dart run build_runner build --delete-conflicting-outputs

            - name: Analyze project
              run: flutter analyze

            - name: Run tests
              run: flutter test

            - name: Build release APK
              run: flutter build apk --release

            - name: Rename Android artifact
              run: |
                  cp build/app/outputs/flutter-apk/app-release.apk \
                     AlgoQuest-${{ github.ref_name }}-android.apk

            - name: Upload Android artifact
              uses: actions/upload-artifact@v7
              with:
                  name: android-release
                  path: AlgoQuest-${{ github.ref_name }}-android.apk

    build-windows:
        name: Build Windows application
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true

            - name: Install dependencies
              run: flutter pub get

            - name: Generate source files
              run: dart run build_runner build --delete-conflicting-outputs

            - name: Analyze project
              run: flutter analyze

            - name: Run tests
              run: flutter test

            - name: Build Windows release
              run: flutter build windows --release

            - name: Package Windows application
              shell: pwsh
              run: |
                  Compress-Archive `
                    -Path build/windows/x64/runner/Release/* `
                    -DestinationPath AlgoQuest-${{ github.ref_name }}-windows.zip

            - name: Upload Windows artifact
              uses: actions/upload-artifact@v7
              with:
                  name: windows-release
                  path: AlgoQuest-${{ github.ref_name }}-windows.zip

    publish-release:
        name: Publish GitHub release
        needs:
            - build-android
            - build-windows
        runs-on: ubuntu-latest

        steps:
            - name: Download Android artifact
              uses: actions/download-artifact@v8
              with:
                  name: android-release
                  path: release-files

            - name: Download Windows artifact
              uses: actions/download-artifact@v8
              with:
                  name: windows-release
                  path: release-files

            - name: Generate checksums
              working-directory: release-files
              run: sha256sum * > SHA256SUMS.txt

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: |
                      release-files/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
